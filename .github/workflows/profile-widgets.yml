name: Profile widgets

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: read

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-snake.svg
            snake/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save generated images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-widgets
          retention-days: 1
          if-no-files-found: error
          path: |
            profile-3d-contrib/*.svg
            snake/*.svg

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-widgets
      - name: Commit refreshed images
        shell: bash
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-night-green.svg
          test -s profile-3d-contrib/profile-green.svg
          test -s snake/github-snake.svg
          test -s snake/github-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/*.svg snake/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile contribution widgets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
